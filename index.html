<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheduler</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1fb;--surface:#ffffff;--text:#241b3a;--muted:#7a7391;--line:#e3def2;
--c1a:#7c5cff;--c1b:#a78bfa;--c2a:#ff6b8b;--c2b:#ffa07a;--c3a:#14b8a6;--c3b:#5eead4;--c4a:#f59e0b;--c4b:#fcd34d;--c5a:#3b82f6;--c5b:#67e8f9;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14101f;--surface:#1e1830;--text:#f1edfb;--muted:#a59dc0;--line:#322a4b;}}
:root[data-theme="dark"]{--bg:#14101f;--surface:#1e1830;--text:#f1edfb;--muted:#a59dc0;--line:#322a4b;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;padding:20px 14px 32px}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px}
.toggle button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:8px 18px;border-radius:999px;cursor:pointer}
.toggle button.on{background:linear-gradient(135deg,#7c5cff,#ff6b8b);color:#fff;font-weight:700}
.wrap{overflow-x:auto;max-width:100%;border-radius:18px}
.grid{display:grid;grid-template-columns:64px repeat(6,minmax(112px,1fr));gap:6px;min-width:780px}
.h{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-weight:700;font-size:14px}
.t{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.e{min-height:92px;border:1px dashed var(--line);border-radius:14px}
.c{min-height:92px;border-radius:14px;padding:10px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 16px rgba(0,0,0,.14);transition:opacity .25s,transform .25s}
.c b{font-size:13px;line-height:1.5}
.c span{font-size:12px;opacity:.95}
.tag{align-self:flex-start;background:rgba(255,255,255,.25);border-radius:999px;padding:2px 8px;font-size:11px}
.c.off{opacity:.12;transform:scale(.96);filter:grayscale(1)}
.k1{background:linear-gradient(135deg,var(--c1a),var(--c1b))}
.k2{background:linear-gradient(135deg,var(--c2a),var(--c2b))}
.k3{background:linear-gradient(135deg,var(--c3a),var(--c3b))}
.k4{background:linear-gradient(135deg,var(--c4a),var(--c4b))}
.k5{background:linear-gradient(135deg,var(--c5a),var(--c5b))}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.legend i{display:flex;align-items:center;gap:6px;font-style:normal;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.legend u{width:10px;height:10px;border-radius:50%;display:inline-block}
.sum{margin-top:14px;font-size:13px;color:var(--muted)}

.mob{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;cursor:pointer;position:relative}
.chip.on{background:linear-gradient(135deg,#7c5cff,#ff6b8b);color:#fff;border-color:transparent;font-weight:700}
.chip.has::after{content:"";position:absolute;top:6px;left:8px;width:6px;height:6px;border-radius:50%;background:#ff6b8b}
.chip.on.has::after{background:#fff}
.mc{display:flex;gap:12px;align-items:stretch;margin-bottom:10px}
.mc .tm{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--muted);text-align:center;padding:6px}
.mc .tm b{color:var(--text);font-size:15px}
.mc .cd{flex:1;border-radius:16px;padding:14px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:8px}
.mc .cd b{font-size:15px;line-height:1.6}
.mc .cd span{font-size:13px;opacity:.95}
.mc.off{opacity:.35}
.mc.off .cd{filter:grayscale(1)}
.none{text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:32px 12px;font-size:14px}
@media (max-width:700px){
body{padding:16px 12px 28px}
.wrap{display:none}
.mob{display:block}
.toggle{display:flex;width:100%}
.toggle button{flex:1}
h1{font-size:20px}
}

.c,.mc{cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,6,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.ov.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:85%;overflow:auto;background:var(--surface);color:var(--text);border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh{padding:20px 18px 16px;color:#fff;border-radius:24px 24px 0 0;position:relative}
.sh h2{margin:0 0 6px;font-size:18px;line-height:1.6;padding-left:36px}
.sh p{margin:0;font-size:13px;opacity:.95}
.x{position:absolute;top:14px;left:14px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.28);color:#fff;font-size:18px;cursor:pointer}
.sb{padding:14px 16px 0}
.sb h3{margin:6px 0 10px;font-size:14px}
.sb h3.m{color:var(--muted);margin-top:20px}
.ro{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ro .dy{font-weight:700;min-width:64px}
.ro .tx{flex:1;font-size:13px;color:var(--muted)}
.ro.dim{opacity:.55}
.nn{color:var(--muted);font-size:13px;padding:8px 2px}
@media (min-width:701px){.ov{align-items:center}.sheet{border-radius:24px}}
</style>
</head>
<body>
<h1>برنامه هفتگی ترم</h1>
<p class="sub">مهندسی کامپیوتر، دانشگاه تبریز</p>
<div class="toggle" id="tg">
<button data-w="even" class="on">هفته زوج</button>
<button data-w="odd">هفته فرد</button>
</div>
<div class="wrap"><div class="grid" id="g"></div></div>
<div class="mob"><div class="chips" id="ch"></div><div id="ml"></div></div>
<div class="legend">
<i><u class="k1"></u>ریاضی ۱</i>
<i><u class="k2"></u>مبانی کامپیوتر و برنامه‌سازی</i>
<i><u class="k3"></u>آشنایی با صنعت کامپیوتر</i>
<i><u class="k4"></u>زبان فارسی</i>
<i><u class="k5"></u>دفاع مقدس و مقاومت</i>
</div>
<p class="sum">۵ درس، ۱۲ واحد. دوشنبه و پنجشنبه کلاس نداری. هفته زوج یعنی شنبه‌ی آن هفته تاریخ زوج دارد.</p>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>
<script>
var days=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه"];
var slots=["۸ تا ۱۰","۱۰ تا ۱۲","۱۲ تا ۱۴","۱۴ تا ۱۶","۱۶ تا ۱۸"];
// [day, slot, class, name, room, onlyEven]
var cl=[
[0,3,"k3","آشنایی با صنعت کامپیوتر (کاربینی)","مکان نامشخص",0],
[1,1,"k1","ریاضی ۱","۲۲۱ برق",0],
[1,3,"k4","زبان فارسی","۲۲۸ برق",1],
[1,4,"k2","مبانی کامپیوتر و برنامه‌سازی","۲۲۸ برق",1],
[3,0,"k4","زبان فارسی","۲۲۸ برق",0],
[3,1,"k2","مبانی کامپیوتر و برنامه‌سازی","۲۲۸ برق",0],
[3,4,"k1","ریاضی ۱","۲۲۱ برق",1],
[4,0,"k5","علوم و معارف دفاع مقدس و مقاومت","۲۴۸ برق",0]
];
var g=document.getElementById("g"),week="even";
function renderG(){
var h='<div></div>';
days.forEach(function(d){h+='<div class="h">'+d+'</div>'});
for(var s=0;s<slots.length;s++){
h+='<div class="t">'+slots[s]+'</div>';
for(var d=0;d<days.length;d++){
var f=cl.filter(function(c){return c[0]==d&&c[1]==s})[0];
if(!f){h+='<div class="e"></div>';continue}
var off=f[5]&&week=="odd";
h+='<div class="c '+f[2]+(off?' off':'')+'" data-n="'+f[3]+'"><b>'+f[3]+'</b><span>'+f[4]+'</span><em class="tag" style="font-style:normal">'+(f[5]?'فقط زوج':'هر هفته')+'</em></div>';
}}
g.innerHTML=h;
}

var gd=(new Date().getDay()+1)%7;if(gd>5)gd=0;var md=gd;
var starts=["۸","۱۰","۱۲","۱۴","۱۶"],ends=["۱۰","۱۲","۱۴","۱۶","۱۸"];
function renderM(){
var ch="";
days.forEach(function(d,i){
var has=cl.some(function(c){return c[0]==i});
ch+='<button class="chip'+(i==md?' on':'')+(has?' has':'')+'" data-d="'+i+'">'+d+'</button>';
});
document.getElementById("ch").innerHTML=ch;
var items=cl.filter(function(c){return c[0]==md}).sort(function(a,b){return a[1]-b[1]});
var h="";
items.forEach(function(f){
var off=f[5]&&week=="odd";
h+='<div class="mc'+(off?' off':'')+'" data-n="'+f[3]+'"><div class="tm"><b>'+starts[f[1]]+'</b><span>تا</span><b>'+ends[f[1]]+'</b></div><div class="cd '+f[2]+'"><b>'+f[3]+'</b><span>'+f[4]+'</span><em class="tag" style="font-style:normal">'+(off?'این هفته برگزار نمی‌شود':(f[5]?'فقط زوج':'هر هفته'))+'</em></div></div>';
});
if(!items.length)h='<div class="none">این روز کلاس نداری 🎉</div>';
document.getElementById("ml").innerHTML=h;
}
document.getElementById("ch").addEventListener("click",function(e){
var d=e.target.getAttribute("data-d");if(d===null)return;
md=+d;renderM();
});
function render(){renderG();renderM();}

var units={"ریاضی ۱":"۳","مبانی کامپیوتر و برنامه‌سازی":"۳","آشنایی با صنعت کامپیوتر (کاربینی)":"۱","زبان فارسی":"۳","علوم و معارف دفاع مقدس و مقاومت":"۲"};
function rowsFor(n,w){
var r=cl.filter(function(c){return c[3]==n&&!(c[5]&&w=="odd")}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
return r;
}
function rowsHtml(r,dim){
if(!r.length)return '<div class="nn">در این هفته برگزار نمی‌شود</div>';
return r.map(function(c){return '<div class="ro'+(dim?' dim':'')+'"><span class="dy">'+days[c[0]]+'</span><span class="tx">'+slots[c[1]]+' • '+c[4]+'</span></div>'}).join("");
}
function showC(n){
var col=cl.filter(function(c){return c[3]==n})[0][2];
var other=week=="even"?"odd":"even";
var nm=function(w){return w=="even"?"هفته زوج":"هفته فرد"};
var cur=rowsFor(n,week),oth=rowsFor(n,other);
document.getElementById("sh").innerHTML=
'<div class="sh '+col+'"><button class="x" id="xb" aria-label="بستن">✕</button><h2>'+n+'</h2><p>'+units[n]+' واحد</p></div>'+
'<div class="sb"><h3>'+nm(week)+' ('+cur.length.toString().replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹"[d]})+' جلسه)</h3>'+rowsHtml(cur,false)+
'<h3 class="m">'+nm(other)+'</h3>'+rowsHtml(oth,true)+'</div>';
document.getElementById("ov").className="ov show";
document.getElementById("xb").onclick=closeC;
}
function closeC(){document.getElementById("ov").className="ov"}
document.getElementById("ov").addEventListener("click",function(e){if(e.target==this)closeC()});
document.addEventListener("keydown",function(e){if(e.key=="Escape")closeC()});
document.addEventListener("click",function(e){
var el=e.target.closest?e.target.closest("[data-n]"):null;
if(el)showC(el.getAttribute("data-n"));
});
document.getElementById("tg").addEventListener("click",function(e){
var w=e.target.getAttribute("data-w");if(!w)return;
week=w;
[].forEach.call(this.children,function(b){b.className=b.getAttribute("data-w")==w?"on":""});
render();
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
