<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه هفتگی</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f3fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
--text:#1c1a2b;--muted:#7a7790;--ac:#6d5ef0;
--bg:linear-gradient(170deg,#fbf9ff 0%,#f3f1fb 55%,#eef1fb 100%);
--card:rgba(255,255,255,.82);--sep:rgba(60,50,100,.10);--chip:rgba(80,70,130,.08);--tap:rgba(80,70,130,.06);
--gb:rgba(255,255,255,.95);--sh:0 6px 24px rgba(90,70,160,.08);--hi:inset 0 1px 0 #fff;
--glass2:rgba(255,255,255,.95);--bar:rgba(255,255,255,.72);--bn:rgba(255,255,255,.9);
--b1:#e2d9ff;--b2:#d6defa;--bo:.6;
--s1:#4f46e5;--s2:#7c3aed;--s3:#b06cf3;--s4:#6f86e8;--s5:#64748b;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--text:#f5f3ff;--muted:#9f9cb6;--ac:#9b8cff;
--bg:#000;
--card:rgba(255,255,255,.07);--sep:rgba(255,255,255,.10);--chip:rgba(255,255,255,.10);--tap:rgba(255,255,255,.06);
--gb:rgba(255,255,255,.13);--sh:0 6px 24px rgba(0,0,0,.6);--hi:inset 0 1px 0 rgba(255,255,255,.10);
--glass2:rgba(255,255,255,.16);--bar:rgba(34,32,50,.72);--bn:rgba(28,26,42,.88);
--b1:#3b2a8f;--b2:#27348a;--bo:.4;
--s1:#7c78ff;--s2:#a077ff;--s3:#c58cff;--s4:#8aa0ff;--s5:#8b97ab;}}
:root[data-theme="dark"]{--text:#f5f3ff;--muted:#9f9cb6;--ac:#9b8cff;--bg:#000;--card:rgba(255,255,255,.07);--sep:rgba(255,255,255,.10);--chip:rgba(255,255,255,.10);--tap:rgba(255,255,255,.06);--gb:rgba(255,255,255,.13);--sh:0 6px 24px rgba(0,0,0,.6);--hi:inset 0 1px 0 rgba(255,255,255,.10);--glass2:rgba(255,255,255,.16);--bar:rgba(34,32,50,.72);--bn:rgba(28,26,42,.88);--b1:#3b2a8f;--b2:#27348a;--bo:.4;--s1:#7c78ff;--s2:#a077ff;--s3:#c58cff;--s4:#8aa0ff;--s5:#8b97ab}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);background-attachment:fixed;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(80px);opacity:var(--bo);z-index:-1;pointer-events:none}
body::before{width:280px;height:280px;background:var(--b1);top:-70px;right:-80px}
body::after{width:320px;height:320px;background:var(--b2);bottom:-110px;left:-110px}
.k1{--c:var(--s1)}.k2{--c:var(--s2)}.k3{--c:var(--s3)}.k4{--c:var(--s4)}.k5{--c:var(--s5)}
.app{max-width:640px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.4px;line-height:1.4}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:8px 0;border-radius:10px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--glass2);color:var(--text);box-shadow:0 2px 8px rgba(40,30,90,.14)}
.strip{display:flex;gap:6px;margin-bottom:18px}
.dy{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 8px;border:0;border-radius:16px;background:none;color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.dy i{width:5px;height:5px;border-radius:50%;background:transparent}
.dy.has i{background:var(--muted);opacity:.5}
.dy.on{background:var(--ac);color:#fff;box-shadow:0 6px 16px rgba(109,94,240,.35)}
.dy.on i{background:#fff;opacity:.9}
.group{background:var(--card);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--sh),var(--hi);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;position:relative;transition:background .15s}
.row+.row::before{content:"";position:absolute;top:0;right:16px;left:16px;height:1px;background:var(--sep)}
.row:active{background:var(--tap)}
.tm{flex:0 0 50px;text-align:center;line-height:1.5}
.tm b{display:block;font-size:15px;font-weight:800}
.tm span{display:block;font-size:12px;color:var(--muted)}
.bar{flex:0 0 4px;align-self:stretch;min-height:38px;border-radius:4px;background:var(--c)}
.inf{flex:1;min-width:0}
.inf b{display:block;font-size:16px;font-weight:600;line-height:1.6}
.inf span{display:block;font-size:13px;color:var(--muted)}
.bd{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);background:var(--chip);padding:3px 10px;border-radius:999px;white-space:nowrap}
.chev{color:var(--muted);opacity:.5;font-size:22px;line-height:1}
.row.off{opacity:.45}
.sec{font-size:13px;font-weight:600;color:var(--muted);margin:22px 10px 8px;display:flex;gap:8px;align-items:center}
.sec em{font-style:normal;font-size:11px;color:#fff;background:var(--ac);border-radius:999px;padding:1px 9px}
.none{padding:34px 12px;text-align:center;color:var(--muted);font-size:14px}
.foot{font-size:13px;color:var(--muted);margin:14px 10px 0;line-height:1.9}
/* floating tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92%,400px);display:flex;gap:4px;padding:6px;border-radius:32px;z-index:60;background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--gb);box-shadow:0 12px 34px rgba(30,15,80,.2),var(--hi)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:8px 0 7px;border-radius:26px;cursor:pointer;transition:.2s}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ac);background:var(--chip)}
/* notification banner */
.bn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;width:min(94%,430px);z-index:100;border-radius:26px;padding:12px 14px 14px;color:var(--text);transform:translate(-50%,-160%);opacity:0;transition:transform .5s cubic-bezier(.2,1.1,.3,1),opacity .3s;touch-action:none;cursor:pointer;background:var(--bn);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--gb);box-shadow:0 14px 40px rgba(30,15,80,.3),var(--hi)}
.bn.show{transform:translate(-50%,0);opacity:1}
.bn.drag{transition:none}
.bh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.bi{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--c)}
.bh .tmx{margin-right:auto}
.bt{font-size:16px;font-weight:800;line-height:1.6}
.bu{font-size:12px;color:var(--muted);margin-bottom:8px}
.bw{font-size:12px;font-weight:800;margin:8px 0 4px}
.bw.o{color:var(--muted);font-weight:600}
.bl{font-size:13px;line-height:1.9}
.bl.o{color:var(--muted)}
.bl em{font-style:normal;font-weight:800}
.grab{width:36px;height:4px;border-radius:4px;background:var(--muted);opacity:.35;margin:10px auto 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs">
<button data-t="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>امروز</button>
<button data-t="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8.5 14h.01M12 14h.01M15.5 14h.01M8.5 17.2h.01M12 17.2h.01"/></svg>هفته</button>
<button data-t="courses"><svg viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5v-15z"/><path d="M5 20.5A2.5 2.5 0 0 0 7.5 21H19v-3M9 7.5h6"/></svg>درس‌ها</button>
</nav>
<div class="bn" id="bn" role="status" aria-live="polite"></div>
<script>
var days=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه"];
var slots=["۸ تا ۱۰","۱۰ تا ۱۲","۱۲ تا ۱۴","۱۴ تا ۱۶","۱۶ تا ۱۸"];
var hrs=[8,10,12,14,16];
// [day, slot, class, name, room, onlyEven]
var cl=[
[0,3,"k3","آشنایی با صنعت کامپیوتر (کاربینی)","مکان نامشخص",0],
[1,1,"k1","ریاضی ۱","۲۲۱ برق",0],
[1,3,"k4","زبان فارسی","۲۲۸ برق",1],
[1,4,"k2","مبانی کامپیوتر و برنامه‌سازی","۲۲۸ برق",1],
[3,0,"k4","زبان فارسی","۲۲۸ برق",0],
[3,1,"k2","مبانی کامپیوتر و برنامه‌سازی","۲۲۸ برق",0],
[3,4,"k1","ریاضی ۱","۲۲۱ برق",1],
[4,0,"k5","علوم و معارف دفاع مقدس و مقاومت","۲۴۸ برق",0]
];
var units={"ریاضی ۱":"۳","مبانی کامپیوتر و برنامه‌سازی":"۳","آشنایی با صنعت کامپیوتر (کاربینی)":"۱","زبان فارسی":"۳","علوم و معارف دفاع مقدس و مقاومت":"۲"};
var order=["ریاضی ۱","مبانی کامپیوتر و برنامه‌سازی","آشنایی با صنعت کامپیوتر (کاربینی)","زبان فارسی","علوم و معارف دفاع مقدس و مقاومت"];
var app=document.getElementById("app"),week="even",tab="today";
var realDay=(new Date().getDay()+1)%7;
var md=realDay>5?0:realDay;
function fa(n){return String(n).replace(/\d/g,function(d){return "۰۱۲۳۴۵۶۷۸۹"[d]})}
function hh(h){return fa(h)+":۰۰"}
function nm(w){return w=="even"?"هفته زوج":"هفته فرد"}
function isOff(f){return f[5]&&week=="odd"}
function row(f,showDay){
var off=isOff(f);
var bd=off?'این هفته نیست':(f[5]?'فقط زوج':'');
return '<div class="row'+(off?' off':'')+'" data-n="'+f[3]+'"><div class="tm"><b>'+hh(hrs[f[1]])+'</b><span>'+hh(hrs[f[1]]+2)+'</span></div><i class="bar '+f[2]+'"></i><div class="inf"><b>'+f[3]+'</b><span>'+f[4]+(showDay?' • '+days[f[0]]:'')+'</span></div>'+(bd?'<em class="bd">'+bd+'</em>':'')+'<span class="chev">‹</span></div>';
}
function seg(){
return '<div class="seg"><button data-w="even"'+(week=="even"?' class="on"':'')+'>هفته زوج</button><button data-w="odd"'+(week=="odd"?' class="on"':'')+'>هفته فرد</button></div>';
}
function view(){
var h="";
if(tab=="today"){
var items=cl.filter(function(c){return c[0]==md}).sort(function(a,b){return a[1]-b[1]});
var live=items.filter(function(c){return !isOff(c)}).length;
h+='<h1>'+(md==realDay?'امروز':days[md])+'</h1><p class="sub">'+(live?fa(live)+' کلاس • '+nm(week):'بدون کلاس • '+nm(week))+'</p>'+seg();
h+='<div class="strip">'+days.map(function(d,i){
var has=cl.some(function(c){return c[0]==i});
return '<button class="dy'+(i==md?' on':'')+(has?' has':'')+'" data-d="'+i+'">'+d+'<i></i></button>';
}).join("")+'</div>';
h+=items.length?'<div class="group">'+items.map(function(f){return row(f,false)}).join("")+'</div>':'<div class="group"><div class="none">این روز کلاس نداری 🎉</div></div>';
}else if(tab=="week"){
h+='<h1>این هفته</h1><p class="sub">'+nm(week)+'</p>'+seg();
days.forEach(function(d,i){
var it=cl.filter(function(c){return c[0]==i}).sort(function(a,b){return a[1]-b[1]});
if(!it.length)return;
h+='<div class="sec">'+d+(i==realDay?'<em>امروز</em>':'')+'</div><div class="group">'+it.map(function(f){return row(f,false)}).join("")+'</div>';
});
h+='<p class="foot">دوشنبه و پنجشنبه کلاس نداری. هفته زوج یعنی شنبه‌ی آن هفته تاریخ زوج دارد.</p>';
}else{
h+='<h1>درس‌ها</h1><p class="sub">۵ درس • ۱۲ واحد</p>'+seg();
h+='<div class="group">'+order.map(function(n){
var f=cl.filter(function(c){return c[3]==n})[0];
var ds=[];rowsFor(n,week).forEach(function(c){if(ds.indexOf(days[c[0]])<0)ds.push(days[c[0]])});
return '<div class="row" data-n="'+n+'"><i class="bar '+f[2]+'"></i><div class="inf"><b>'+n+'</b><span>'+units[n]+' واحد • '+ds.join("، ")+'</span></div><span class="chev">‹</span></div>';
}).join("")+'</div>';
}
app.innerHTML=h;
[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.className=b.getAttribute("data-t")==tab?"on":""});
}
/* notification banner */
var bn=document.getElementById("bn"),bt=null;
function rowsFor(n,w){return cl.filter(function(c){return c[3]==n&&!(c[5]&&w=="odd")}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1]})}
function lines(r,o){
if(!r.length)return '<div class="bl'+(o?' o':'')+'">در این هفته برگزار نمی‌شود</div>';
return r.map(function(c){return '<div class="bl'+(o?' o':'')+'"><em>'+days[c[0]]+'</em> • '+slots[c[1]]+' • '+c[4]+'</div>'}).join("");
}
function showC(n){
var col=cl.filter(function(c){return c[3]==n})[0][2];
var other=week=="even"?"odd":"even";
bn.innerHTML='<div class="bh"><span class="bi">📅</span><span>برنامه کلاس</span><span class="tmx">الان</span></div>'+
'<div class="bt">'+n+'</div><div class="bu">'+units[n]+' واحد</div>'+
'<div class="bw">'+nm(week)+'</div>'+lines(rowsFor(n,week),false)+
'<div class="bw o">'+nm(other)+'</div>'+lines(rowsFor(n,other),true)+
'<div class="grab"></div>';
bn.style.transform="";
bn.className="bn "+col+" show";
clearTimeout(bt);bt=setTimeout(hideC,8000);
}
function hideC(){clearTimeout(bt);bn.style.transform="";bn.className=bn.className.replace(" show","")}
var sy=0,dy=0;
bn.addEventListener("touchstart",function(e){sy=e.touches[0].clientY;dy=0;bn.classList.add("drag");clearTimeout(bt)},{passive:true});
bn.addEventListener("touchmove",function(e){dy=e.touches[0].clientY-sy;if(dy<0)bn.style.transform="translate(-50%,"+dy+"px)"},{passive:true});
bn.addEventListener("touchend",function(){bn.classList.remove("drag");if(dy<-35){hideC()}else{bn.style.transform="";bt=setTimeout(hideC,6000)}});
bn.addEventListener("click",function(){if(dy>-8)hideC()});
document.addEventListener("keydown",function(e){if(e.key=="Escape")hideC()});
document.addEventListener("click",function(e){
var t=e.target.closest?e.target:null;if(!t)return;
var el;
if(el=t.closest("[data-t]")){tab=el.getAttribute("data-t");view();window.scrollTo(0,0);return}
if(el=t.closest("[data-w]")){week=el.getAttribute("data-w");view();return}
if(el=t.closest("[data-d]")){md=+el.getAttribute("data-d");view();return}
if(el=t.closest("[data-n]")){showC(el.getAttribute("data-n"))}
});
view();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
